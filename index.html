<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NBA Pick 'Em">
<title>NBA Pick 'Em 2026-27</title>
<style>
    :root {
        --bg-color: #0b0f19;
        --card-bg: #131b2e;
        --card-border: #1e293b;
        --accent-blue: #00d2ff;
        --accent-green: #10b981;
        --accent-red: #ef4444;
        --text-main: #f8fafc;
        --text-sub: #94a3b8;
    }

    body {
        background-color: var(--bg-color);
        color: var(--text-main);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        margin: 0;
        padding: 16px;
        display: flex;
        justify-content: center;
        user-select: none;
    }
    .container { width: 100%; max-width: 480px; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .logo-title h1 { font-size: 1.25rem; font-weight: 800; margin: 0; color: #fff; }
    .save-btn {
        background: var(--accent-green);
        color: #000;
        border: none;
        padding: 10px 18px;
        border-radius: 10px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
    }
    .record-card {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 14px;
        padding: 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
    }
    .record-title { font-size: 0.75rem; font-weight: 700; color: var(--text-sub); letter-spacing: 1px; }
    .record-value { font-size: 1.2rem; font-weight: 800; margin-top: 4px; }
    .streak-badge {
        font-size: 0.75rem;
        font-weight: 800;
        padding: 3px 8px;
        border-radius: 12px;
        background: #1e293b;
        color: var(--accent-blue);
        margin-top: 4px;
        display: inline-block;
    }
    .manual-record-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(255,255,255,0.03);
        border: 1px dashed var(--card-border);
        border-radius: 10px;
        padding: 8px 12px;
        margin-bottom: 16px;
        font-size: 0.75rem;
        color: var(--text-sub);
    }
    .adjust-btn {
        background: #1e293b;
        color: #fff;
        border: 1px solid var(--card-border);
        padding: 4px 8px;
        border-radius: 6px;
        font-size: 0.7rem;
        cursor: pointer;
        font-weight: bold;
    }

    .date-nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 12px;
        padding: 10px 14px;
        margin-bottom: 16px;
    }
    .nav-btn {
        background: #1e293b;
        color: var(--text-main);
        border: none;
        padding: 8px 14px;
        border-radius: 8px;
        font-weight: 700;
        cursor: pointer;
    }
    .current-date-label { font-size: 0.95rem; font-weight: 800; color: var(--accent-blue); }

    .game-card {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 16px;
        padding: 16px;
        margin-bottom: 16px;
    }
    .game-meta { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-sub); margin-bottom: 12px; font-weight: 600; }
    .status-badge {
        font-size: 0.7rem;
        padding: 2px 8px;
        border-radius: 10px;
        background: #1e293b;
        color: var(--text-sub);
    }
    .status-badge.live { background: rgba(239, 68, 68, 0.2); color: var(--accent-red); font-weight: bold; }
    .status-badge.final { background: rgba(16, 185, 129, 0.2); color: var(--accent-green); font-weight: bold; }

    .teams-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .team-box {
        background: rgba(255, 255, 255, 0.02);
        border: 1.5px solid var(--card-border);
        border-radius: 12px;
        padding: 14px 8px;
        text-align: center;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        transition: all 0.2s;
    }
    .team-box.disabled { opacity: 0.85; cursor: not-allowed; }
    .team-box img { width: 48px; height: 48px; object-fit: contain; margin-bottom: 8px; }
    .team-name { font-size: 0.85rem; font-weight: 700; margin-bottom: 2px; }
    .win-prob { font-size: 0.7rem; color: var(--accent-blue); font-weight: 600; margin-bottom: 4px; }
    .team-score { font-size: 1.1rem; font-weight: 800; margin: 4px 0; color: #fff; }
    .team-sub { font-size: 0.65rem; color: var(--text-sub); margin-bottom: 8px; }
    
    .pick-btn {
        width: 80%;
        padding: 6px 0;
        border-radius: 20px;
        border: 1px solid var(--card-border);
        background: transparent;
        color: var(--text-sub);
        font-size: 0.75rem;
        font-weight: 700;
        pointer-events: none;
    }
    .team-box.selected { border-color: var(--accent-blue); background: rgba(0, 210, 255, 0.1); }
    .team-box.selected .pick-btn { background: var(--accent-blue); color: #000; border-color: var(--accent-blue); }

    /* Result states for finished games */
    .team-box.correct-win { border-color: var(--accent-green) !important; background: rgba(16, 185, 129, 0.15) !important; }
    .team-box.correct-win .pick-btn { background: var(--accent-green) !important; color: #000 !important; border-color: var(--accent-green) !important; }

    .team-box.wrong-loss { border-color: var(--accent-red) !important; background: rgba(239, 68, 68, 0.15) !important; }
    .team-box.wrong-loss .pick-btn { background: var(--accent-red) !important; color: #fff !important; border-color: var(--accent-red) !important; }
    
    #toast {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--accent-green);
        color: #000;
        padding: 10px 20px;
        border-radius: 25px;
        font-weight: 800;
        display: none;
    }
</style>
</head>
<body>

<div class="container">
    <header>
        <div class="logo-title"><h1>NBA PICK 'EM</h1></div>
        <button class="save-btn" onclick="savePicks()">💾 Save Picks</button>
    </header>

    <div class="record-card">
        <div>
            <div class="record-title">SEASON RECORD</div>
            <div class="record-value"><span id="wCount" style="color:var(--accent-green);">0W</span> - <span id="lCount" style="color:var(--accent-red);">0L</span></div>
            <div class="streak-badge" id="streakBadge">-- Streak</div>
        </div>
        <div>
            <div class="record-title" style="text-align: right;">WIN RATE</div>
            <div class="win-rate-val" id="winRate" style="font-size:1.2rem; font-weight:800; color:var(--accent-blue); text-align:right; margin-top:4px;">0.0%</div>
        </div>
    </div>

    <!-- Manual Record Adjustment Bar -->
    <div class="manual-record-bar">
        <span>Adjust Bonus/Past Wins:</span>
        <div>
            <button class="adjust-btn" onclick="adjustManualRecord(1, 0)">+1 Win</button>
            <button class="adjust-btn" onclick="adjustManualRecord(0, 1)">+1 Loss</button>
            <button class="adjust-btn" onclick="resetManualRecord()">Reset</button>
        </div>
    </div>

    <div class="date-nav">
        <button class="nav-btn" onclick="changeDate(-1)">◀ Prev</button>
        <div class="current-date-label" id="dateLabel">Loading...</div>
        <button class="nav-btn" onclick="changeDate(1)">Next ▶</button>
    </div>

    <div id="gamesContainer">Loading NBA Schedule & Odds...</div>
</div>

<div id="toast">Picks Saved!</div>

<script>
    let currentDate = new Date(); // Starts on today's live date
    let userPicks = JSON.parse(localStorage.getItem('nba_picks_v3') || '{}');
    let finishedGamesCache = JSON.parse(localStorage.getItem('nba_finished_games') || '{}');
    let bonusStats = JSON.parse(localStorage.getItem('nba_bonus_stats') || '{"wins": 0, "losses": 0}');

    function cleanAbbr(abbr) {
        if (!abbr) return '';
        let map = { 'NY':'NYK', 'SA':'SAS', 'GS':'GSW', 'NO':'NOP', 'UTAH':'UTA', 'WSH':'WAS' };
        return map[abbr.toUpperCase()] || abbr.toUpperCase();
    }

    function formatDateForESPN(date) {
        let yyyy = date.getFullYear();
        let mm = String(date.getMonth() + 1).padStart(2, '0');
        let dd = String(date.getDate()).padStart(2, '0');
        return `${yyyy}${mm}${dd}`;
    }

    function formatDateDisplay(date) {
        return date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    }

    function formatPSTTime(isoString, shortDetail) {
        if (!isoString) return shortDetail;
        let date = new Date(isoString);
        return date.toLocaleTimeString('en-US', {
            timeZone: 'America/Los_Angeles',
            hour: 'numeric',
            minute: '2-digit',
            hour12: true
        }) + ' PST';
    }

    async function fetchScores() {
        let dateStr = formatDateForESPN(currentDate);
        document.getElementById('dateLabel').innerText = formatDateDisplay(currentDate);
        let container = document.getElementById('gamesContainer');
        container.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-sub);">Fetching live ESPN data...</div>';

        try {
            let res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard?dates=${dateStr}`);
            let data = await res.json();
            renderGames(data.events || []);
        } catch (e) {
            container.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--accent-red);">Failed to load NBA data.</div>';
        }
    }

    function calculateImpliedProb(moneyline) {
        if (!moneyline) return null;
        let ml = parseInt(moneyline);
        let prob = ml < 0 ? (-ml / (-ml + 100)) : (100 / (ml + 100));
        return Math.round(prob * 100) + "%";
    }

    function renderGames(events) {
        let container = document.getElementById('gamesContainer');
        if (events.length === 0) {
            container.innerHTML = '<div style="text-align:center; padding: 30px; color: var(--text-sub);">No games scheduled for this date.</div>';
            return;
        }

        container.innerHTML = '';
        events.forEach(event => {
            let game = event.competitions[0];
            let home = game.competitors.find(c => c.homeAway === 'home');
            let away = game.competitors.find(c => c.homeAway === 'away');
            
            let homeAbbr = cleanAbbr(home.team.abbreviation);
            let awayAbbr = cleanAbbr(away.team.abbreviation);

            let status = event.status.type.state;
            let statusText = status === 'pre' ? formatPSTTime(event.date, event.status.type.shortDetail) : event.status.type.shortDetail;
            let gameId = event.id;
            let isLocked = status !== 'pre';

            let homeProb = null;
            let awayProb = null;

            if (game.predictor && game.predictor.homeTeam) {
                homeProb = Math.round(game.predictor.homeTeam.gameProjection) + "%";
                awayProb = Math.round(game.predictor.awayTeam.gameProjection) + "%";
            } else if (game.odds && game.odds[0]) {
                let oddsObj = game.odds[0];
                if (oddsObj.homeTeamOdds && oddsObj.homeTeamOdds.moneyLine) homeProb = calculateImpliedProb(oddsObj.homeTeamOdds.moneyLine);
                if (oddsObj.awayTeamOdds && oddsObj.awayTeamOdds.moneyLine) awayProb = calculateImpliedProb(oddsObj.awayTeamOdds.moneyLine);
            }

            let homeProbText = homeProb ? `📊 ${homeProb} Win Prob` : '';
            let awayProbText = awayProb ? `📊 ${awayProb} Win Prob` : '';

            let winnerAbbr = null;
            if (status === 'post') {
                let homeScore = parseInt(home.score || 0);
                let awayScore = parseInt(away.score || 0);
                winnerAbbr = homeScore > awayScore ? homeAbbr : awayAbbr;
                finishedGamesCache[gameId] = {
                    date: event.date,
                    winner: winnerAbbr
                };
                localStorage.setItem('nba_finished_games', JSON.stringify(finishedGamesCache));
            } else if (finishedGamesCache[gameId]) {
                winnerAbbr = finishedGamesCache[gameId].winner;
            }

            let rawPick = userPicks[gameId] || null;
            let pickedTeam = cleanAbbr(rawPick);

            // Determine check or X styling if game is final and picked
            let awayClass = '';
            let homeClass = '';
            let awayBtnText = pickedTeam === awayAbbr ? (isLocked ? '🔒 Picked' : '✓ Selected') : (isLocked ? '🔒 Locked' : 'Pick');
            let homeBtnText = pickedTeam === homeAbbr ? (isLocked ? '🔒 Picked' : '✓ Selected') : (isLocked ? '🔒 Locked' : 'Pick');

            if (status === 'post' && pickedTeam) {
                if (pickedTeam === awayAbbr) {
                    if (pickedTeam === winnerAbbr) {
                        awayClass = 'correct-win';
                        awayBtnText = '✓ Correct';
                    } else {
                        awayClass = 'wrong-loss';
                        awayBtnText = '✗ Incorrect';
                    }
                }
                if (pickedTeam === homeAbbr) {
                    if (pickedTeam === winnerAbbr) {
                        homeClass = 'correct-win';
                        homeBtnText = '✓ Correct';
                    } else {
                        homeClass = 'wrong-loss';
                        homeBtnText = '✗ Incorrect';
                    }
                }
            } else if (pickedTeam === awayAbbr) {
                awayClass = 'selected';
            } else if (pickedTeam === homeAbbr) {
                homeClass = 'selected';
            }

            let cardHtml = `
                <div class="game-card" data-game-id="${gameId}">
                    <div class="game-meta">
                        <span>${statusText}</span>
                        <span class="status-badge ${status}">${status === 'in' ? 'LIVE' : (status === 'post' ? 'FINAL' : (isLocked ? '🔒 LOCKED' : 'UPCOMING'))}</span>
                    </div>
                    <div class="teams-grid">
                        <div class="team-box ${awayClass} ${isLocked ? 'disabled' : ''}" onclick="makePick('${gameId}', '${awayAbbr}', ${isLocked})">
                            <img src="${away.team.logo}" alt="${awayAbbr}">
                            <div class="team-name">${away.team.displayName}</div>
                            <div class="win-prob">${awayProbText}</div>
                            ${status !== 'pre' ? `<div class="team-score">${away.score}</div>` : ''}
                            <div class="team-sub">${awayAbbr} • AWAY</div>
                            <button class="pick-btn">${awayBtnText}</button>
                        </div>
                        <div class="team-box ${homeClass} ${isLocked ? 'disabled' : ''}" onclick="makePick('${gameId}', '${homeAbbr}', ${isLocked})">
                            <img src="${home.team.logo}" alt="${homeAbbr}">
                            <div class="team-name">${home.team.displayName}</div>
                            <div class="win-prob">${homeProbText}</div>
                            ${status !== 'pre' ? `<div class="team-score">${home.score}</div>` : ''}
                            <div class="team-sub">${homeAbbr} • HOME</div>
                            <button class="pick-btn">${homeBtnText}</button>
                        </div>
                    </div>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', cardHtml);
        });

        calculateRecord();
    }

    function makePick(gameId, teamAbbr, isLocked) {
        if (isLocked) return;
        userPicks[gameId] = cleanAbbr(teamAbbr);
        let card = document.querySelector(`[data-game-id="${gameId}"]`);
        card.querySelectorAll('.team-box').forEach(t => {
            let isThisTeam = t.querySelector('.team-sub').innerText.includes(teamAbbr);
            t.classList.toggle('selected', isThisTeam);
            t.querySelector('.pick-btn').innerText = isThisTeam ? '✓ Selected' : 'Pick';
        });
        savePicks();
    }

    function savePicks() {
        localStorage.setItem('nba_picks_v3', JSON.stringify(userPicks));
        calculateRecord();
        let t = document.getElementById('toast');
        t.style.display = 'block';
        setTimeout(() => t.style.display = 'none', 1500);
    }

    function adjustManualRecord(w, l) {
        bonusStats.wins += w;
        bonusStats.losses += l;
        localStorage.setItem('nba_bonus_stats', JSON.stringify(bonusStats));
        calculateRecord();
    }

    function resetManualRecord() {
        bonusStats = {wins: 0, losses: 0};
        localStorage.setItem('nba_bonus_stats', JSON.stringify(bonusStats));
        calculateRecord();
    }

    function calculateRecord() {
        let wins = bonusStats.wins, losses = bonusStats.losses;
        let sortedFinished = Object.keys(finishedGamesCache)
            .map(id => ({ id, ...finishedGamesCache[id] }))
            .sort((a, b) => new Date(a.date) - new Date(b.date));

        let currentStreak = bonusStats.wins;
        let streakType = bonusStats.wins > 0 ? 'W' : null;

        sortedFinished.forEach(game => {
            let rawPick = userPicks[game.id];
            let pick = cleanAbbr(rawPick);
            let winner = cleanAbbr(game.winner);

            if (pick) {
                let won = (pick === winner);
                if (won) {
                    wins++;
                    if (streakType === 'W') currentStreak++;
                    else { streakType = 'W'; currentStreak = 1; }
                } else {
                    losses++;
                    if (streakType === 'L') currentStreak++;
                    else { streakType = 'L'; currentStreak = 1; }
                }
            }
        });

        document.getElementById('wCount').innerText = wins + 'W';
        document.getElementById('lCount').innerText = losses + 'L';
        let total = wins + losses;
        document.getElementById('winRate').innerText = total > 0 ? ((wins / total) * 100).toFixed(1) + '%' : '0.0%';

        let streakEl = document.getElementById('streakBadge');
        if (currentStreak > 0) {
            streakEl.innerText = `${currentStreak}${streakType} Streak`;
            streakEl.style.color = streakType === 'W' ? 'var(--accent-green)' : 'var(--accent-red)';
        } else {
            streakEl.innerText = '-- Streak';
            streakEl.style.color = 'var(--text-sub)';
        }
    }

    function changeDate(days) {
        currentDate.setDate(currentDate.getDate() + days);
        fetchScores();
    }

    fetchScores();
</script>
</body>
</html>

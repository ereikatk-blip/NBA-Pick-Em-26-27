<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NBA Pick 'Em">
<title>NBA Pick 'Em 2026-27</title>
<style>
    :root {
        --bg-color: #0b0f19;
        --card-bg: #131b2e;
        --card-border: #1e293b;
        --accent-blue: #00d2ff;
        --accent-green: #10b981;
        --accent-red: #ef4444;
        --text-main: #f8fafc;
        --text-sub: #94a3b8;
    }

    body {
        background-color: var(--bg-color);
        color: var(--text-main);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        margin: 0;
        padding: 16px;
        display: flex;
        justify-content: center;
        user-select: none;
    }
    .container { width: 100%; max-width: 480px; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .logo-title h1 { font-size: 1.25rem; font-weight: 800; margin: 0; color: #fff; }
    .save-btn {
        background: var(--accent-green);
        color: #000;
        border: none;
        padding: 10px 18px;
        border-radius: 10px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
    }
    .record-card {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 14px;
        padding: 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
    }
    .record-title { font-size: 0.75rem; font-weight: 700; color: var(--text-sub); letter-spacing: 1px; }
    .record-value { font-size: 1.2rem; font-weight: 800; margin-top: 4px; }
    .streak-badge {
        font-size: 0.75rem;
        font-weight: 800;
        padding: 3px 8px;
        border-radius: 12px;
        background: #1e293b;
        color: var(--accent-blue);
        margin-top: 4px;
        display: inline-block;
    }
    
    /* Daily Record Display */
    .daily-record-card {
        background: rgba(0, 210, 255, 0.05);
        border: 1px solid rgba(0, 210, 255, 0.2);
        border-radius: 12px;
        padding: 12px 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
    }
    .daily-title { font-size: 0.75rem; font-weight: 700; color: var(--accent-blue); letter-spacing: 1px; }
    .daily-value { font-size: 1.1rem; font-weight: 800; color: #fff; margin-top: 2px; }

    .manual-record-bar {
        background: rgba(255,255,255,0.03);
        border: 1px dashed var(--card-border);
        border-radius: 10px;
        padding: 10px 12px;
        margin-bottom: 16px;
    }
    .manual-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.75rem;
        color: var(--text-sub);
        margin-bottom: 6px;
    }
    .manual-row:last-child { margin-bottom: 0; }
    .adjust-btn {
        background: #1e293b;
        color: #fff;
        border: 1px solid var(--card-border);
        padding: 4px 10px;
        border-radius: 6px;
        font-size: 0.7rem;
        cursor: pointer;
        font-weight: bold;
    }

    .date-nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 12px;
        padding: 10px 14px;
        margin-bottom: 16px;
    }
    .nav-btn {
        background: #1e293b;
        color: var(--text-main);
        border: none;
        padding: 8px 14px;
        border-radius: 8px;
        font-weight: 700;
        cursor: pointer;
    }
    .current-date-label { font-size: 0.95rem; font-weight: 800; color: var(--accent-blue); }

    .game-card {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 16px;
        padding: 16px;
        margin-bottom: 16px;
    }
    .game-meta { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-sub); margin-bottom: 12px; font-weight: 600; }
    .status-badge {
        font-size: 0.7rem;
        padding: 2px 8px;
        border-radius: 10px;
        background: #1e293b;
        color: var(--text-sub);
    }
    .status-badge.live { background: rgba(239, 68, 68, 0.2); color: var(--accent-red); font-weight: bold; }
    .status-badge.final { background: rgba(16, 185, 129, 0.2); color: var(--accent-green); font-weight: bold; }

    .teams-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .team-box {
        background: rgba(255, 255, 255, 0.02);
        border: 1.5px solid var(--card-border);
        border-radius: 12px;
        padding: 14px 8px;
        text-align: center;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        transition: all 0.2s;
    }
    .team-box.disabled { opacity: 0.85; cursor: not-allowed; }
    .team-box img { width: 48px; height: 48px; object-fit: contain; margin-bottom: 8px; }
    .team-name { font-size: 0.85rem; font-weight: 700; margin-bottom: 2px; }
    .win-prob { font-size: 0.7rem; color: var(--accent-blue); font-weight: 600; margin-bottom: 4px; }
    .team-score { font-size: 1.1rem; font-weight: 800; margin: 4px 0; color: #fff; }
    .team-sub { font-size: 0.65rem; color: var(--text-sub); margin-bottom: 8px; }
    
    .pick-btn {
        width: 80%;
        padding: 6px 0;
        border-radius: 20px;
        border: 1px solid var(--card-border);
        background: transparent;
        color: var(--text-sub);
        font-size: 0.75rem;
        font-weight: 700;
        pointer-events: none;
    }
    .team-box.selected { border-color: var(--accent-blue); background: rgba(0, 210, 255, 0.1); }
    .team-box.selected .pick-btn { background: var(--accent-blue); color: #000; border-color: var(--accent-blue); }

    .team-box.correct-win { border-color: var(--accent-green) !important; background: rgba(16, 185, 129, 0.15) !important; }
    .team-box.correct-win .pick-btn { background: var(--accent-green) !important; color: #000 !important; border-color: var(--accent-green) !important; }

    .team-box.wrong-loss { border-color: var(--accent-red) !important; background: rgba(239, 68, 68, 0.15) !important; }
    .team-box.wrong-loss .pick-btn { background: var(--accent-red) !important; color: #fff !important; border-color: var(--accent-red) !important; }
    
    #toast {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--accent-green);
        color: #000;
        padding: 10px 20px;
        border-radius: 25px;

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NBA Pick 'Em">
<title>NBA Pick 'Em 2026-27</title>
<style>
    :root {
        --bg-color: #0b0f19;
        --card-bg: #131b2e;
        --card-border: #1e293b;
        --accent-blue: #00d2ff;
        --accent-green: #10b981;
        --accent-red: #ef4444;
        --text-main: #f8fafc;
        --text-sub: #94a3b8;
    }

    /* Team Colors Map */
    .team-box[data-team="BOS"].selected { border-color: #008348; background: rgba(0, 131, 72, 0.15); }
    .team-box[data-team="BOS"].selected .pick-btn { background: #008348; color: #fff; }

    .team-box[data-team="LAL"].selected { border-color: #fdb927; background: rgba(253, 185, 39, 0.15); }
    .team-box[data-team="LAL"].selected .pick-btn { background: #fdb927; color: #000; }

    .team-box[data-team="GSW"].selected { border-color: #1d428a; background: rgba(29, 66, 138, 0.2); }
    .team-box[data-team="GSW"].selected .pick-btn { background: #ffc72c; color: #000; }

    .team-box[data-team="NYK"].selected { border-color: #f58426; background: rgba(245, 132, 38, 0.15); }
    .team-box[data-team="NYK"].selected .pick-btn { background: #f58426; color: #000; }

    .team-box[data-team="MIA"].selected { border-color: #98002e; background: rgba(152, 0, 46, 0.2); }
    .team-box[data-team="MIA"].selected .pick-btn { background: #98002e; color: #fff; }

    body {
        background-color: var(--bg-color);
        color: var(--text-main);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        margin: 0;
        padding: 16px;
        display: flex;
        justify-content: center;
        user-select: none;
    }
    .container { width: 100%; max-width: 480px; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .logo-title h1 { font-size: 1.25rem; font-weight: 800; margin: 0; color: #fff; }
    .save-btn {
        background: var(--accent-green);
        color: #000;
        border: none;
        padding: 10px 18px;
        border-radius: 10px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
    }
    .record-card {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 14px;
        padding: 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
    }
    .record-title { font-size: 0.75rem; font-weight: 700; color: var(--text-sub); letter-spacing: 1px; }
    .record-value { font-size: 1.2rem; font-weight: 800; margin-top: 4px; }
    .streak-badge {
        font-size: 0.75rem;
        font-weight: 800;
        padding: 3px 8px;
        border-radius: 12px;
        background: #1e293b;
        color: var(--accent-blue);
        margin-top: 4px;
        display: inline-block;
    }
    
    .date-nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 12px;
        padding: 10px 14px;
        margin-bottom: 16px;
    }
    .nav-btn {
        background: #1e293b;
        color: var(--text-main);
        border: none;
        padding: 8px 14px;
        border-radius: 8px;
        font-weight: 700;
        cursor: pointer;
    }
    .current-date-label { font-size: 0.95rem; font-weight: 800; color: var(--accent-blue); }

    .game-card {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 16px;
        padding: 16px;
        margin-bottom: 16px;
    }
    .game-meta { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-sub); margin-bottom: 12px; font-weight: 600; }
    .status-badge {
        font-size: 0.7rem;
        padding: 2px 8px;
        border-radius: 10px;
        background: #1e293b;
        color: var(--text-sub);
    }
    .status-badge.live { background: rgba(239, 68, 68, 0.2); color: var(--accent-red); font-weight: bold; }
    .status-badge.final { background: rgba(16, 185, 129, 0.2); color: var(--accent-green); font-weight: bold; }

    .teams-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .team-box {
        background: rgba(255, 255, 255, 0.02);
        border: 1.5px solid var(--card-border);
        border-radius: 12px;
        padding: 14px 8px;
        text-align: center;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        transition: all 0.2s;
    }
    .team-box.disabled { opacity: 0.6; cursor: not-allowed; }
    .team-box img { width: 48px; height: 48px; object-fit: contain; margin-bottom: 8px; }
    .team-name { font-size: 0.85rem; font-weight: 700; margin-bottom: 2px; }
    .win-prob { font-size: 0.7rem; color: var(--accent-blue); font-weight: 600; margin-bottom: 4px; }
    .team-score { font-size: 1.1rem; font-weight: 800; margin: 4px 0; color: #fff; }
    .team-sub { font-size: 0.65rem; color: var(--text-sub); margin-bottom: 8px; }
    .pick-btn {
        width: 80%;
        padding: 6px 0;
        border-radius: 20px;
        border: 1px solid var(--card-border);
        background: transparent;
        color: var(--text-sub);
        font-size: 0.75rem;
        font-weight: 700;
        pointer-events: none;
    }
    .team-box.selected { border-color: var(--accent-blue); background: rgba(0, 210, 255, 0.08); }
    .team-box.selected .pick-btn { background: var(--accent-blue); color: #000; border-color: var(--accent-blue); }
    
    #toast {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--accent-green);
        color: #000;
        padding: 10px 20px;
        border-radius: 25px;
        font-weight: 800;
        display: none;
    }
</style>
</head>
<body>

<div class="container">
    <header>
        <div class="logo-title"><h1>NBA PICK 'EM</h1></div>
        <button class="save-btn" onclick="savePicks()">💾 Save Picks</button>
    </header>

    <div class="record-card">
        <div>
            <div class="record-title">SEASON RECORD</div>
            <div class="record-value"><span id="wCount" style="color:var(--accent-green);">0W</span> - <span id="lCount" style="color:var(--accent-red);">0L</span></div>
            <div class="streak-badge" id="streakBadge">-- Streak</div>
        </div>
        <div>
            <div class="record-title" style="text-align: right;">WIN RATE</div>
            <div class="win-rate-val" id="winRate" style="font-size:1.2rem; font-weight:800; color:var(--accent-blue); text-align:right; margin-top:4px;">0.0%</div>
        </div>
    </div>

    <div class="date-nav">
        <button class="nav-btn" onclick="changeDate(-1)">◀ Prev</button>
        <div class="current-date-label" id="dateLabel">Loading...</div>
        <button class="nav-btn" onclick="changeDate(1)">Next ▶</button>
    </div>

    <div id="gamesContainer">Loading NBA Schedule & Odds...</div>
</div>

<div id="toast">Picks Saved!</div>

<script>
    let currentDate = new Date('2026-10-20T12:00:00');
    let userPicks = JSON.parse(localStorage.getItem('nba_picks_v3') || '{}');
    let finishedGamesCache = JSON.parse(localStorage.getItem('nba_finished_games') || '{}');

    function formatDateForESPN(date) {
        let yyyy = date.getFullYear();
        let mm = String(date.getMonth() + 1).padStart(2, '0');
        let dd = String(date.getDate()).padStart(2, '0');
        return `${yyyy}${mm}${dd}`;
    }

    function formatDateDisplay(date) {
        return date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    }

    async function fetchScores() {
        let dateStr = formatDateForESPN(currentDate);
        document.getElementById('dateLabel').innerText = formatDateDisplay(currentDate);
        let container = document.getElementById('gamesContainer');
        container.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-sub);">Fetching live ESPN data...</div>';

        try {
            let res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard?dates=${dateStr}`);
            let data = await res.json();
            renderGames(data.events || []);
        } catch (e) {
            container.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--accent-red);">Failed to load NBA data.</div>';
        }
    }

    function calculateImpliedProb(moneyline) {
        if (!moneyline) return null;
        let ml = parseInt(moneyline);
        let prob = ml < 0 ? (-ml / (-ml + 100)) : (100 / (ml + 100));
        return Math.round(prob * 100) + "%";
    }

    function renderGames(events) {
        let container = document.getElementById('gamesContainer');
        if (events.length === 0) {
            container.innerHTML = '<div style="text-align:center; padding: 30px; color: var(--text-sub);">No games scheduled for this date.</div>';
            return;
        }

        container.innerHTML = '';
        events.forEach(event => {
            let game = event.competitions[0];
            let home = game.competitors.find(c => c.homeAway === 'home');
            let away = game.competitors.find(c => c.homeAway === 'away');
            let status = event.status.type.state;
            let statusText = event.status.type.shortDetail;
            let gameId = event.id;
            let isLocked = status !== 'pre';

            let homeProb = null;
            let awayProb = null;

            if (game.predictor && game.predictor.homeTeam) {
                homeProb = Math.round(game.predictor.homeTeam.gameProjection) + "%";
                awayProb = Math.round(game.predictor.awayTeam.gameProjection) + "%";
            } else if (game.odds && game.odds[0]) {
                let oddsObj = game.odds[0];
                if (oddsObj.homeTeamOdds && oddsObj.homeTeamOdds.moneyLine) homeProb = calculateImpliedProb(oddsObj.homeTeamOdds.moneyLine);
                if (oddsObj.awayTeamOdds && oddsObj.awayTeamOdds.moneyLine) awayProb = calculateImpliedProb(oddsObj.awayTeamOdds.moneyLine);
            }

            let homeProbText = homeProb ? `📊 ${homeProb} Win Prob` : '';
            let awayProbText = awayProb ? `📊 ${awayProb} Win Prob` : '';

            if (status === 'post') {
                let homeScore = parseInt(home.score || 0);
                let awayScore = parseInt(away.score || 0);
                finishedGamesCache[gameId] = {
                    date: event.date,
                    winner: homeScore > awayScore ? home.team.abbreviation : away.team.abbreviation
                };
                localStorage.setItem('nba_finished_games', JSON.stringify(finishedGamesCache));
            }

            let pickedTeam = userPicks[gameId] || null;

            let cardHtml = `
                <div class="game-card" data-game-id="${gameId}">
                    <div class="game-meta">
                        <span>${statusText}</span>
                        <span class="status-badge ${status}">${status === 'in' ? 'LIVE' : (status === 'post' ? 'FINAL' : (isLocked ? '🔒 LOCKED' : 'UPCOMING'))}</span>
                    </div>
                    <div class="teams-grid">
                        <div class="team-box ${pickedTeam === away.team.abbreviation ? 'selected' : ''} ${isLocked ? 'disabled' : ''}" data-team="${away.team.abbreviation}" onclick="makePick('${gameId}', '${away.team.abbreviation}', ${isLocked})">
                            <img src="${away.team.logo}" alt="${away.team.abbreviation}">
                            <div class="team-name">${away.team.displayName}</div>
                            <div class="win-prob">${awayProbText}</div>
                            ${status !== 'pre' ? `<div class="team-score">${away.score}</div>` : ''}
                            <div class="team-sub">${away.team.abbreviation} • AWAY</div>
                            <button class="pick-btn">${pickedTeam === away.team.abbreviation ? (isLocked ? '🔒 Picked' : '✓ Selected') : (isLocked ? '🔒 Locked' : 'Pick')}</button>
                        </div>
                        <div class="team-box ${pickedTeam === home.team.abbreviation ? 'selected' : ''} ${isLocked ? 'disabled' : ''}" data-team="${home.team.abbreviation}" onclick="makePick('${gameId}', '${home.team.abbreviation}', ${isLocked})">
                            <img src="${home.team.logo}" alt="${home.team.abbreviation}">
                            <div class="team-name">${home.team.displayName}</div>
                            <div class="win-prob">${homeProbText}</div>
                            ${status !== 'pre' ? `<div class="team-score">${home.score}</div>` : ''}
                            <div class="team-sub">${home.team.abbreviation} • HOME</div>
                            <button class="pick-btn">${pickedTeam === home.team.abbreviation ? (isLocked ? '🔒 Picked' : '✓ Selected') : (isLocked ? '🔒 Locked' : 'Pick')}</button>
                        </div>
                    </div>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', cardHtml);
        });

        calculateRecord();
    }

    function makePick(gameId, teamAbbr, isLocked) {
        if (isLocked) return;
        userPicks[gameId] = teamAbbr;
        let card = document.querySelector(`[data-game-id="${gameId}"]`);
        card.querySelectorAll('.team-box').forEach(t => {
            let isThisTeam = t.querySelector('.team-sub').innerText.includes(teamAbbr);
            t.classList.toggle('selected', isThisTeam);
            t.querySelector('.pick-btn').innerText = isThisTeam ? '✓ Selected' : 'Pick';
        });
        savePicks();
    }

    function savePicks() {
        localStorage.setItem('nba_picks_v3', JSON.stringify(userPicks));
        calculateRecord();
        let t = document.getElementById('toast');
        t.style.display = 'block';
        setTimeout(() => t.style.display = 'none', 1500);
    }

    function calculateRecord() {
        let wins = 0, losses = 0;
        let sortedFinished = Object.keys(finishedGamesCache)
            .map(id => ({ id, ...finishedGamesCache[id] }))
            .sort((a, b) => new Date(a.date) - new Date(b.date));

        let currentStreak = 0;
        let streakType = null;

        sortedFinished.forEach(game => {
            let pick = userPicks[game.id];
            if (pick) {
                let won = pick === game.winner;
                if (won) {
                    wins++;
                    if (streakType === 'W') currentStreak++;
                    else { streakType = 'W'; currentStreak = 1; }
                } else {
                    losses++;
                    if (streakType === 'L') currentStreak++;
                    else { streakType = 'L'; currentStreak = 1; }
                }
            }
        });

        document.getElementById('wCount').innerText = wins + 'W';
        document.getElementById('lCount').innerText = losses + 'L';
        let total = wins + losses;
        document.getElementById('winRate').innerText = total > 0 ? ((wins / total) * 100).toFixed(1) + '%' : '0.0%';

        let streakEl = document.getElementById('streakBadge');
        if (currentStreak > 0) {
            streakEl.innerText = `${currentStreak}${streakType} Streak`;
            streakEl.style.color = streakType === 'W' ? 'var(--accent-green)' : 'var(--accent-red)';
        } else {
            streakEl.innerText = '-- Streak';
            streakEl.style.color = 'var(--text-sub)';
        }
    }

    function changeDate(days) {
        currentDate.setDate(currentDate.getDate() + days);
        fetchScores();
    }

    fetchScores();
</script>
</body>
</html>

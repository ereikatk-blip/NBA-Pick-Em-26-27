<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NBA Pick 'Em</title>
<style>
    body { background: #0b0f19; color: #fff; font-family: -apple-system, sans-serif; padding: 16px; max-width: 500px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    h1 { color: #00d2ff; font-size: 1.2rem; margin: 0; }
    .save-btn { background: #10b981; color: #fff; border: none; padding: 8px 16px; font-weight: bold; border-radius: 8px; cursor: pointer; }
    .record { background: #131b2e; padding: 12px; border-radius: 8px; display: flex; justify-content: space-between; margin-bottom: 16px; border: 1px solid #1e293b; }
    .card { background: #131b2e; border: 1px solid #1e293b; border-radius: 12px; padding: 12px; margin-bottom: 12px; }
    .header { font-size: 0.75rem; color: #94a3b8; margin-bottom: 10px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .team { background: rgba(255,255,255,0.03); border: 1px solid #1e293b; border-radius: 8px; padding: 12px; text-align: center; cursor: pointer; }
    .team.selected { border-color: #00d2ff; background: rgba(0, 210, 255, 0.15); }
    .name { font-weight: bold; font-size: 0.9rem; margin-top: 4px; }
    #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #10b981; color: #fff; padding: 8px 16px; border-radius: 20px; display: none; font-weight: bold; }
</style>
</head>
<body>

<header>
    <h1>NBA PICK 'EM</h1>
    <button class="save-btn" onclick="savePicks()">Save Picks</button>
</header>

<div class="record">
    <div><strong>RECORD:</strong> <span id="rec">0W - 0L</span></div>
    <div><strong>WIN RATE:</strong> <span id="rate">0.0%</span></div>
</div>

<div class="card" data-id="1">
    <div class="header">Tue, Oct 20 • 3:00 PM ET</div>
    <div class="grid">
        <div class="team" onclick="pick(1, 'BOS')"><div class="name">Celtics</div></div>
        <div class="team" onclick="pick(1, 'DET')"><div class="name">Pistons</div></div>
    </div>
</div>

<div class="card" data-id="2">
    <div class="header">Tue, Oct 20 • 7:00 PM ET</div>
    <div class="grid">
        <div class="team" onclick="pick(2, 'PHI')"><div class="name">76ers</div></div>
        <div class="team" onclick="pick(2, 'NYK')"><div class="name">Knicks</div></div>
    </div>
</div>

<div class="card" data-id="3">
    <div class="header">Tue, Oct 20 • 8:30 PM ET</div>
    <div class="grid">
        <div class="team" onclick="pick(3, 'OKC')"><div class="name">Thunder</div></div>
        <div class="team" onclick="pick(3, 'SAS')"><div class="name">Spurs</div></div>
    </div>
</div>

<div id="toast">Saved to device!</div>

<script>
    let picks = JSON.parse(localStorage.getItem('nba_picks_app') || '{}');

    function load() {
        for (let id in picks) {
            let card = document.querySelector(`[data-id="${id}"]`);
            if (card) {
                card.querySelectorAll('.team').forEach(t => {
                    if (t.getAttribute('onclick').includes(picks[id])) t.classList.add('selected');
                });
            }
        }
    }

    function pick(id, team) {
        picks[id] = team;
        let card = document.querySelector(`[data-id="${id}"]`);
        card.querySelectorAll('.team').forEach(t => t.classList.remove('selected'));
        event.currentTarget.classList.add('selected');
    }

    function savePicks() {
        localStorage.setItem('nba_picks_app', JSON.stringify(picks));
        let t = document.getElementById('toast');
        t.style.display = 'block';
        setTimeout(() => t.style.display = 'none', 2000);
    }

    load();
</script>
</body>
</html>
